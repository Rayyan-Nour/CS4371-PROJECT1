input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"
    # One document per entity: a new running total replaces the old one
    document_id => "%{entity}"
  }
}
